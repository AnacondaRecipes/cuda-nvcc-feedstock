anaconda_config_version: 1
upstream_sources:
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/cuda-nvcc
      regex: '"version":\s*"([^"]+)"'
    packages:
      - cuda-nvcc
      - cuda-nvcc_linux-64
      - cuda-nvcc_linux-aarch64
      - cuda-nvcc_win-64
      - cuda-nvcc_win-arm64
      - cuda-crt
      - cuda-nvvm
